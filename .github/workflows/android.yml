name: Android Release APK & AAB

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed Release APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Validate signing secrets and decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ] || [ -z "${RELEASE_STORE_PASSWORD}" ] || [ -z "${RELEASE_KEY_PASSWORD}" ]; then
            echo "Missing required release signing secrets (RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_PASSWORD)." >&2
            exit 1
          fi
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${RUNNER_TEMP}/my-upload-key.jks"
          chmod 600 "${RUNNER_TEMP}/my-upload-key.jks"

      - name: Build signed Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Clean up decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/my-upload-key.jks"

      - name: Verify APK and AAB release signing (reject Android Debug)
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "${APK_PATH}" ]; then
            echo "Release APK not found at ${APK_PATH}" >&2
            exit 1
          fi
          if [ ! -f "${AAB_PATH}" ]; then
            echo "Release AAB not found at ${AAB_PATH}" >&2
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "${SDK_ROOT}/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "${APKSIGNER}" ] || [ ! -x "${APKSIGNER}" ]; then
            echo "apksigner not found in Android SDK build-tools." >&2
            exit 1
          fi

          "${APKSIGNER}" verify --verbose --print-certs "${APK_PATH}" > "${RUNNER_TEMP}/apk-cert-info.txt" 2>&1
          cat "${RUNNER_TEMP}/apk-cert-info.txt"
          if grep -qi "Android Debug" "${RUNNER_TEMP}/apk-cert-info.txt"; then
            echo "ERROR: Release APK is signed with Android Debug certificate!" >&2
            exit 1
          fi

          if ! jarsigner -verify -verbose -certs "${AAB_PATH}" > "${RUNNER_TEMP}/aab-verify.txt" 2>&1; then
            cat "${RUNNER_TEMP}/aab-verify.txt"
            echo "ERROR: jarsigner could not verify the Release AAB." >&2
            exit 1
          fi
          cat "${RUNNER_TEMP}/aab-verify.txt"
          if ! grep -qi "jar verified\." "${RUNNER_TEMP}/aab-verify.txt"; then
            echo "ERROR: Release AAB signature verification failed!" >&2
            exit 1
          fi
          if grep -qi "Android Debug" "${RUNNER_TEMP}/aab-verify.txt"; then
            echo "ERROR: Release AAB is signed with Android Debug certificate!" >&2
            exit 1
          fi

      - name: Stage release artifacts
        run: |
          mkdir -p release-outputs
          cp app/build/outputs/apk/release/app-release.apk release-outputs/SIP-Dial-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release-outputs/SIP-Dial-release.aab

      - name: Upload signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIP-Dial-release-apk
          path: release-outputs/SIP-Dial-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIP-Dial-release-aab
          path: release-outputs/SIP-Dial-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-outputs/SIP-Dial-release.apk
            release-outputs/SIP-Dial-release.aab
